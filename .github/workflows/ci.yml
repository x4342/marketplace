name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://marketplace:marketplace-local@127.0.0.1:54329/marketplace?sslmode=disable
      HTTP_ADDR: 127.0.0.1:8080
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace-local
          POSTGRES_DB: marketplace
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make setup
      - run: make fmt && git diff --exit-code -- '*.go' '*.templ'
      - run: make lint test build audit
      - run: make migrate && make rollback && make migrate
      - run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          make fixtures && make fixtures
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: MARKETPLACE_IDENTITY_TEST_DATABASE_URL="$DATABASE_URL" go test -mod=readonly -race ./internal/http -run TestIdentityPostgres -v
      - run: MARKETPLACE_CATALOG_TEST_DATABASE_URL="$DATABASE_URL" go test -mod=readonly -race ./internal/http -run TestCatalogPostgres -v
      - run: MARKETPLACE_SELLER_TEST_DATABASE_URL="$DATABASE_URL" go test -mod=readonly -race ./internal/http -run TestSellerPostgres -v
      - run: MARKETPLACE_MESSAGES_TEST_DATABASE_URL="$DATABASE_URL" go test -mod=readonly -race ./internal/http -run TestMessagesPostgres -v
      - run: MARKETPLACE_ORDERS_TEST_DATABASE_URL="$DATABASE_URL" go test -mod=readonly -race ./internal/http -run TestOrdersPostgres -v
      - run: MARKETPLACE_REVIEWS_TEST_DATABASE_URL="$DATABASE_URL" go test -mod=readonly -race ./internal/http -run TestReviewsPostgres -v
      - run: MARKETPLACE_FINANCE_TEST_DATABASE_URL="$DATABASE_URL" go test -mod=readonly -race ./internal/http -run TestFinancePostgres -v
      - run: MARKETPLACE_ADMIN_TEST_DATABASE_URL="$DATABASE_URL" go test -mod=readonly -race ./internal/http -run TestAdminPostgres -v
      - run: MARKETPLACE_PROFILE_TEST_DATABASE_URL="$DATABASE_URL" go test -mod=readonly -race ./internal/http -run TestProfilesPostgres -v
      - run: MARKETPLACE_ROLES_TEST_DATABASE_URL="$DATABASE_URL" go test -mod=readonly -race ./internal/http -run TestRolesPostgres -v
      - name: Test migration and verified claim on a legacy identity database
        run: |
          createdb --maintenance-db "$DATABASE_URL" marketplace_legacy_ci
          export MARKETPLACE_LEGACY_ROLE_TEST_DATABASE_URL="${DATABASE_URL%/*}/marketplace_legacy_ci?sslmode=disable"
          go test -mod=readonly -race ./internal/identity -run TestLegacyRolesPostgres -v
      - name: Test administrator controls on a separate database
        run: |
          createdb --maintenance-db "$DATABASE_URL" marketplace_platform_ci
          export DATABASE_URL="${DATABASE_URL%/*}/marketplace_platform_ci?sslmode=disable"
          make migrate fixtures
          MARKETPLACE_PLATFORM_TEST_DATABASE_URL="$DATABASE_URL" go test -mod=readonly -race ./internal/http -run TestPlatformPostgres -v
      - run: bash scripts/smoke.sh
      - run: make reconcile
      - name: Restore populated PostgreSQL fixtures
        run: |
          createdb --maintenance-db "$DATABASE_URL" marketplace_restore_ci
          export RESTORE_DATABASE_URL="${DATABASE_URL%/*}/marketplace_restore_ci?sslmode=disable"
          # Run archive tools from the same PostgreSQL major version as the service.
          pg_tools=$(mktemp -d)
          for tool in pg_dump pg_restore; do
            printf '#!/usr/bin/env bash\nexec docker run --rm -i --network host postgres:17 %s "$@"\n' "$tool" > "$pg_tools/$tool"
            chmod +x "$pg_tools/$tool"
          done
          PATH="$pg_tools:$PATH" make restore-drill
          export MARKETPLACE_ORDERS_TEST_DATABASE_URL="$RESTORE_DATABASE_URL"
          export MARKETPLACE_FINANCE_TEST_DATABASE_URL="$RESTORE_DATABASE_URL"
          export MARKETPLACE_ADMIN_TEST_DATABASE_URL="$RESTORE_DATABASE_URL"
          go test -mod=readonly -race ./internal/http -run 'Test(Admin|Finance|Orders)Postgres$' -v
          DATABASE_URL="$RESTORE_DATABASE_URL" make reconcile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-smoke
          path: bin/smoke/
          if-no-files-found: ignore
